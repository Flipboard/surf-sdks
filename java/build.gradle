plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'social.surf'
version = '0.2.0'
description = 'Java SDK for the Surf social platform API'

ext {
    jacksonVersion = '2.17.2'
    junitVersion = '5.10.2'
}

repositories {
    mavenCentral()
}

dependencies {
    // JSON (de)serialization. HTTP is handled by the built-in java.net.http.HttpClient.
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Tests
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// release=17 makes the JDK reject any API newer than Java 17, guaranteeing Java 17
// source + bytecode compatibility even when building on a newer JDK (e.g. 21).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    withSourcesJar()
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'surf-api'
                description = project.description
                url = 'https://developers.surf.social'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        name = 'Flipboard'
                        email = 'support@surf.social'
                    }
                }
                scm {
                    url = 'https://github.com/Flipboard/surf-sdks'
                    connection = 'scm:git:https://github.com/Flipboard/surf-sdks.git'
                }
            }
        }
    }
}
