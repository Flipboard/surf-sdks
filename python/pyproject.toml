[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surf-api"
version = "0.1.0"
description = "Python SDK for the Surf social platform API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Flipboard", email = "support@surf.social" },
]
keywords = ["surf", "api", "social", "feeds", "bluesky", "mastodon", "fediverse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://developers.surf.social"
Documentation = "https://developers.surf.social/devportal/v1/api-docs"
Repository = "https://github.com/Flipboard/surf-api-python"
Issues = "https://github.com/Flipboard/surf-api-python/issues"
